# Local infrastructure for host-run backend and frontend.
name: ecommerce

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3:
    image: chrislusf/seaweedfs
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/seaweedfs/s3-entrypoint.sh"]
    command:
      - server
      - -ip=seaweed-master
      - -ip.bind=0.0.0.0
      - -dir=/data/volume
      - -master.dir=/data/master
      - -volume.max=64
      - -filer
      - -s3
      - -s3.port=8333
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-dev-access-key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dev-secret-key}
    networks:
      default:
        aliases: [seaweed-master]
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - seaweed-master-data:/data/master
      - seaweed-volume-data:/data/volume
      - seaweed-filer-data:/data/filer
      - ./infra/seaweedfs/dev-filer.toml:/etc/seaweedfs/filer.toml:ro
      - ./infra/seaweedfs/s3.template.json:/etc/seaweedfs/s3.template.json:ro
      - ./infra/seaweedfs/s3-entrypoint.sh:/etc/seaweedfs/s3-entrypoint.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          nc -z -w 1 127.0.0.1 8333 &&
          wget -qO- http://127.0.0.1:9333/dir/status |
          grep -q '"Url":"seaweed-master:8080"'
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 10

volumes:
  postgres-data:
  seaweed-master-data:
  seaweed-volume-data:
  seaweed-filer-data:
