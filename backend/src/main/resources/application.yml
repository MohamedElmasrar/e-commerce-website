server:
  port: 8080

spring:
  application:
    name: ecommerce
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:ecommerce}}
    username: ${DB_USER:${POSTGRES_USER:ecommerce}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:change-me}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:5MB}
      max-request-size: ${MAX_UPLOAD_SIZE:5MB}
  flyway:
    enabled: true
    # Seed data (known admin password, demo products) lives in db/seed and is opt-in for dev only.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
    ignore-migration-patterns: '*:missing'

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  structured:
    format:
      console: ecs

app:
  public-url: ${PUBLIC_URL:http://localhost:${FRONTEND_PORT:3000}}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:ecommerce}
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
    refresh-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${app.public-url}}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:${S3_PORT:8333}}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:ecommerce-media}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    path-style: ${S3_PATH_STYLE:true}
  storage:
    max-image-bytes: ${STORAGE_MAX_IMAGE_BYTES:5242880}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
    success-url: ${STRIPE_SUCCESS_URL:${app.public-url}/checkout/success}
    cancel-url: ${STRIPE_CANCEL_URL:${app.public-url}/checkout/cancel}
